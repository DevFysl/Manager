name: Check phone alerts

on:
  schedule:
    # Every 3 minutes. GitHub's scheduler can slip a few minutes under load —
    # fine here since the thresholds have 20+ minutes of slack.
    - cron: '*/3 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification only'
        type: boolean
        default: false

concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-alerts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node check-alerts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ github.event.inputs.test }}
